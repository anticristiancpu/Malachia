services:
  malachia:
    build: .
    image: malachia:latest
    container_name: malachia
    restart: unless-stopped
    ports:
      # host:container — cambia la porta host a sinistra se 3001 è occupata
      - "3001:3001"
    environment:
      NODE_ENV: production
      BACKEND_PORT: "3001"
      # BookOrbit, per la sezione Ebook. Mettili in un file .env qui accanto:
      # docker compose lo legge da solo e le credenziali restano fuori da git.
      # Senza queste variabili tutto il resto funziona: solo la pagina Ebook
      # avvisa che il server non e' configurato.
      BOOKORBIT_URL: "${BOOKORBIT_URL:-}"
      BOOKORBIT_USERNAME: "${BOOKORBIT_USERNAME:-}"
      BOOKORBIT_PASSWORD: "${BOOKORBIT_PASSWORD:-}"
    volumes:
      # Database SQLite attuale (con WAL/SHM) — dati persistenti
      - ./data:/app/data
      # Copertine, sfondi e altri caricamenti — dati persistenti
      - ./uploads:/app/uploads
